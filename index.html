<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1F1D">
<title>Freelance HQ</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="gate" class="gate hidden" role="main"></div>
<div class="shell" id="shell">
  <aside class="side" aria-label="Main">
    <div class="brand"><img src="assets/logo.svg" alt=""><div><b>Freelance HQ</b><span>Our freelance workspace</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot"><div class="userchip" id="userchip"></div></div>
  </aside>
  <div class="work">
    <div class="topbar"><img src="assets/logo.svg" alt=""><b>Freelance HQ</b><div class="userchip mini" id="userchip2"></div></div>
    <main>
      <div id="banner" class="banner hidden" role="status"></div>
      <div id="view"></div>
    </main>
  </div>
</div>
<nav class="mobilenav" id="mnav" aria-label="Sections"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"><div id="dlgbody"></div></dialog>
<script type="module" src="js/app.js"></script>
</body>
</html>
